name: Android client

on:
  push:
    paths:
      - 'apps/family_screen_time/**'
      - 'packages/screentime_engine/**'
      - 'packages/screentime_sync/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/family_screen_time/**'
      - 'packages/screentime_engine/**'
      - 'packages/screentime_sync/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/family_screen_time
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v6
        with:
          name: apks
          path: apps/family_screen_time/build/app/outputs/flutter-apk/*-release.apk
      # The demonstration build: its own app, a made-up family, nothing kept.
      - run: flutter build apk --release -t lib/main_demo.dart -P demo=true
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/family-screen-time-demo.apk
      - uses: actions/upload-artifact@v6
        with:
          name: demo-apk
          path: apps/family_screen_time/build/app/outputs/flutter-apk/family-screen-time-demo.apk
